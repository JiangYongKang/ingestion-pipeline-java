# ===================== 接入管线示例配置 =====================
# 状态根目录：offset / data / schema / dlq / metrics / 批次幂等结果均落在此目录（按来源分子目录）
ingestion.state-dir=./data
ingestion.default-batch-size=100
ingestion.default-max-inflight=1000
ingestion.default-max-attempts=3
ingestion.default-poll-interval-ms=500
# 拉取调度总开关
ingestion.pull.enabled=true
# 进程级总容量：所有来源（推送+拉取）共享的在途处理许可总数；<=0 表示不启用
# 公平份额 = max(1, global-max-inflight / 来源数)，任何来源在全局池中的占用不超过其份额
ingestion.global-max-inflight=10000

# ---- 来源 1：推送式 ----
# POST /api/sources/orders-push/ingest，Header: X-API-Key: push-token-orders
ingestion.sources[0].name=orders-push
ingestion.sources[0].type=PUSH
ingestion.sources[0].token=push-token-orders
ingestion.sources[0].batch-size=100
ingestion.sources[0].rate-limit-per-sec=50
ingestion.sources[0].max-inflight=200
ingestion.sources[0].max-attempts=3

# ---- 来源 2：文件拉取式 ----
# 读取 dir 下 records-*.jsonl（JSON Lines，每行 {"key":"...","data":{...}}）
ingestion.sources[1].name=inventory-file
ingestion.sources[1].type=PULL_FILE
ingestion.sources[1].token=file-token-inventory
ingestion.sources[1].dir=./data/sample-file-source
ingestion.sources[1].batch-size=50
ingestion.sources[1].poll-interval-ms=1000
ingestion.sources[1].max-attempts=3

# ---- 来源 3：HTTP 拉取式（默认关闭；启用前先启动本服务并向 mock 端点 seed）----
ingestion.sources[2].name=payments-http
ingestion.sources[2].type=PULL_HTTP
ingestion.sources[2].token=http-token-payments
ingestion.sources[2].url=http://127.0.0.1:8080/mock/sources/payments-http
ingestion.sources[2].batch-size=50
ingestion.sources[2].poll-interval-ms=1000
ingestion.sources[2].max-attempts=3
ingestion.sources[2].enabled=false
