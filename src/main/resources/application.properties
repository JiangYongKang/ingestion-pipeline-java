# ===== 接入管线配置 =====
# 持久化根目录（位点快照、数据 WAL/快照、隔离记录、指标、结构、来源注册）
ingestion.data-dir=data/ingestion

# 单批最大记录数：超出直接 BATCH_TOO_LARGE，保证处理有界、及时返回
ingestion.max-batch-size=100

# 每来源在途记录积压上限
ingestion.backlog-limit=200
# 积压策略：REJECT（立即拒绝）或 RATE_LIMIT（在等待时限内限速准入）
ingestion.backlog-policy=REJECT
ingestion.backlog-await-millis=2000

# 隔离记录最大自动尝试次数（达到后 exhausted，不再重投）
ingestion.max-retry-attempts=3

# 拉取式来源调度开关与间隔
ingestion.pull-scheduler-enabled=true
ingestion.pull-interval-millis=5000

# 管理端点令牌（生产环境务必通过环境变量覆盖；为空时所有管理操作被拒绝）
ingestion.admin-token=${INGESTION_ADMIN_TOKEN:dev-admin-token}

# 示例来源（默认不启用，避免空目录副作用）：
